events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream cluster_manager {
    server cluster-manager:8080;
  }

  upstream grafana_backend {
    server grafana:3000;
  }

  server {
    listen 8080;
    server_name _;

    location = /_auth {
      internal;
      proxy_pass http://cluster_manager/auth/check;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-CCM-Peer-Token $http_x_ccm_peer_token;
    }

    location @login {
      return 302 /login;
    }

    # Local Cluster 1 Grafana.
    location /cluster1/grafana/ {
      auth_request /_auth;
      error_page 401 = @login;
      rewrite ^/cluster1/grafana/(.*) /$1 break;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://grafana_backend;
    }

    # Cluster 2 Grafana stays on Cluster 2. Cluster 1 only proxies it so the
    # browser keeps one origin/session. Cluster 2 authenticates the fixed peer
    # token before forwarding to its local Grafana.
    location /cluster2/grafana/ {
      auth_request /_auth;
      error_page 401 = @login;
      proxy_http_version 1.1;
      proxy_set_header Host 165.132.142.133:8080;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-CCM-Peer-Token clustermanager;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_redirect http://165.132.142.133:8080/cluster2/grafana/ /cluster2/grafana/;
      proxy_pass http://165.132.142.133:8080;
    }

    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://cluster_manager;
    }
  }
}
