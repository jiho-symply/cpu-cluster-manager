services:
  cluster-manager:
    build:
      context: ./manager
    container_name: cpu-cluster-manager
    restart: unless-stopped
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      NODES_CONFIG: /app/config/nodes.yaml
      SSH_KEY: /run/ssh/id_ed25519
      SSH_KNOWN_HOSTS: /run/ssh/known_hosts
      GRAFANA_BASE_URL: ${GRAFANA_BASE_URL:-http://127.0.0.1:3000}
    ports:
      - "${UI_BIND:-127.0.0.1}:${UI_PORT:-8080}:8080"
    volumes:
      - ./config/nodes.yaml:/app/config/nodes.yaml:ro
      - ${SSH_KEY_PATH:?set SSH_KEY_PATH in .env}:/run/ssh/id_ed25519:ro
      - ${SSH_KNOWN_HOSTS_PATH:?set SSH_KNOWN_HOSTS_PATH in .env}:/run/ssh/known_hosts:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  prometheus-hot:
    image: prom/prometheus:v3.14.0
    container_name: cpu-cluster-prometheus-hot
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.wal-segment-size=16MB
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - ./monitoring/targets:/etc/prometheus/targets:ro
      - prometheus_hot_data:/prometheus
    depends_on:
      - alertmanager

  prometheus-archive:
    image: prom/prometheus:v3.14.0
    container_name: cpu-cluster-prometheus-archive
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=5y
      - --storage.tsdb.retention.size=${ARCHIVE_RETENTION_SIZE:?run scripts/install-master.sh to set ARCHIVE_RETENTION_SIZE}
      - --storage.tsdb.wal-segment-size=8MB
    volumes:
      - ./monitoring/prometheus-archive/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_archive_data:/prometheus
    depends_on:
      - prometheus-hot

  alertmanager:
    image: prom/alertmanager:v0.34.0
    container_name: cpu-cluster-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

  grafana:
    image: grafana/grafana:13.2.1
    container_name: cpu-cluster-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${ADMIN_USERNAME:?set ADMIN_USERNAME in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cluster-recent.json
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus-hot
      - prometheus-archive

volumes:
  prometheus_hot_data:
  prometheus_archive_data:
  alertmanager_data:
