services:
  gateway:
    image: nginx:1.27-alpine
    container_name: cpu-cluster-gateway
    restart: unless-stopped
    ports:
      - "${UI_HOST:?set UI_HOST in host-local cluster config}:${UI_PORT:-8080}:8080"
    volumes:
      # Keep interpolation deliberately simple for Docker Compose 2.6 on the
      # validated CentOS 7 master. CLUSTER is already required below by the
      # manager service, so a separate :? expression is unnecessary here.
      - ./gateway/nginx-${CLUSTER}.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - cluster-manager
      - grafana
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true

  cluster-manager:
    image: cpu-cluster-manager-app:local
    build:
      context: ./manager
    container_name: cpu-cluster-manager
    restart: unless-stopped
    environment:
      CLUSTER: ${CLUSTER:?set CLUSTER in host-local cluster config}
      NODES: ${NODES:?set NODES in host-local cluster config}
      SSH_USER: ysadmin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in host-local cluster config}
      PEER_CLUSTER: ${PEER_CLUSTER:-}
      PEER_URL: ${PEER_URL:-}
      SSH_KEY: /run/ssh/id_ed25519
      SSH_KNOWN_HOSTS: /run/ssh/known_hosts
      MASTER_CONTROL_SOCKET: /run/master-control.sock
    volumes:
      - /var/lib/cpu-cluster-manager/ssh/id_ed25519:/run/ssh/id_ed25519:ro
      - /var/lib/cpu-cluster-manager/ssh/known_hosts:/run/ssh/known_hosts:ro
      - /run/cpu-cluster-manager/master-control.sock:/run/master-control.sock
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  master-node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: cpu-cluster-master-node-exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave

  prometheus-hot:
    image: prom/prometheus:v3.14.0
    container_name: cpu-cluster-prometheus-hot
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.wal-segment-size=16MB
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - ./monitoring/targets:/etc/prometheus/targets:ro
      - prometheus_hot_data:/prometheus
    depends_on:
      - alertmanager
      - master-node-exporter

  prometheus-archive:
    image: prom/prometheus:v3.14.0
    container_name: cpu-cluster-prometheus-archive
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=5y
      - --storage.tsdb.retention.size=${ARCHIVE_RETENTION_SIZE:?computed by scripts/compose.sh}
      - --storage.tsdb.wal-segment-size=10MB
    volumes:
      - ./monitoring/prometheus-archive/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_archive_data:/prometheus
    depends_on:
      - prometheus-hot

  prometheus-router:
    image: cpu-cluster-manager-app:local
    container_name: cpu-cluster-prometheus-router
    restart: unless-stopped
    command: ["uvicorn", "app.prometheus_router:app", "--host", "0.0.0.0", "--port", "8080"]
    depends_on:
      - prometheus-hot
      - prometheus-archive
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  alertmanager:
    image: prom/alertmanager:v0.34.0
    container_name: cpu-cluster-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

  grafana:
    image: grafana/grafana:13.2.1
    container_name: cpu-cluster-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${ADMIN_USERNAME:-clusteradmin}
      GF_SECURITY_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in host-local cluster config}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SERVER_DOMAIN: ${UI_HOST:?set UI_HOST in host-local cluster config}
      GF_SERVER_ROOT_URL: http://${UI_HOST}:${UI_PORT:-8080}/${CLUSTER}/grafana/
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cluster-monitoring.json
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus-router

volumes:
  prometheus_hot_data:
  prometheus_archive_data:
  alertmanager_data:
