<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ cluster }} · CPU Cluster Manager</title>
  <style>
    :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; background: #0b1020; color: #e7eaf0; }
    main { max-width: 1080px; margin: 0 auto; padding: 28px 20px 48px; }
    header { display:flex; justify-content:space-between; align-items:end; gap:16px; margin-bottom:18px; }
    h1 { margin:0; font-size:24px; }
    .muted { color:#9aa4b2; }
    .toolbar,.actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    button,a.button { border:1px solid #34405a; background:#172036; color:#eef2f7; border-radius:8px; padding:8px 11px; cursor:pointer; text-decoration:none; }
    button:hover,a.button:hover { background:#202b45; }
    button.danger { border-color:#6e3840; }
    button:disabled { opacity:.45; cursor:default; }
    table { width:100%; border-collapse:collapse; background:#11182a; border:1px solid #27324a; border-radius:10px; overflow:hidden; }
    th,td { text-align:left; padding:12px 10px; border-bottom:1px solid #27324a; vertical-align:middle; }
    th { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:#9aa4b2; }
    td { font-size:14px; }
    .status { display:inline-flex; align-items:center; gap:7px; }
    .dot { width:9px; height:9px; border-radius:50%; background:#7b8496; }
    .dot.ok { background:#3fb950; }
    .dot.bad { background:#f85149; }
    dialog { width:min(760px,calc(100vw - 40px)); border:1px solid #34405a; border-radius:10px; background:#11182a; color:#eef2f7; }
    dialog::backdrop { background:rgba(0,0,0,.6); }
    pre { white-space:pre-wrap; word-break:break-word; background:#090e1a; padding:14px; border-radius:8px; max-height:60vh; overflow:auto; }
    @media (max-width:820px) { .table-wrap { overflow-x:auto; } table { min-width:780px; } }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>{{ cluster }} · Control Plane</h1>
      <div class="muted">{{ node_count }} compute nodes · Docker control via SSH</div>
    </div>
    <div class="toolbar">
      <a class="button" href="{{ grafana_base_url }}/d/cluster-recent/cluster-recent" target="_blank" rel="noopener">Open Grafana</a>
      <span id="updated" class="muted">-</span>
      <button id="refresh" type="button">Refresh</button>
    </div>
  </header>

  <div class="table-wrap">
    <table>
      <thead><tr><th>Node</th><th>rent-node</th><th>Renter</th><th>Monitoring</th><th>Actions</th></tr></thead>
      <tbody id="nodes"><tr><td colspan="5">Loading…</td></tr></tbody>
    </table>
  </div>
</main>

<dialog id="logs-dialog">
  <form method="dialog" style="display:flex;justify-content:space-between;align-items:center;gap:12px">
    <strong id="logs-title">Logs</strong><button>Close</button>
  </form>
  <pre id="logs-content">Loading…</pre>
</dialog>

<script>
const tbody=document.getElementById('nodes');
const updated=document.getElementById('updated');
const logsDialog=document.getElementById('logs-dialog');
const logsTitle=document.getElementById('logs-title');
const logsContent=document.getElementById('logs-content');
const grafanaBase={{ grafana_base_url | tojson }};
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function actionButton(node,action,label,danger=false){return `<button type="button" data-node="${esc(node)}" data-action="${action}" class="${danger?'danger':''}">${label}</button>`;}
function monitorLinks(node){const n=encodeURIComponent(node);return `<div class="actions"><a class="button" target="_blank" rel="noopener" href="${esc(grafanaBase)}/d/cluster-recent/cluster-recent?orgId=1&var-node=${n}">Recent</a><a class="button" target="_blank" rel="noopener" href="${esc(grafanaBase)}/d/cluster-archive/cluster-long-term?orgId=1&var-node=${n}&from=now-1y&to=now">3y History</a></div>`;}
async function loadNodes(){
  const res=await fetch('/api/nodes',{headers:{Accept:'application/json'}}); if(!res.ok) throw new Error(`HTTP ${res.status}`);
  const data=await res.json();
  tbody.innerHTML=data.nodes.map(n=>{
    if(!n.reachable) return `<tr><td><strong>${esc(n.name)}</strong><div class="muted">${esc(n.host)}</div></td><td colspan="3"><span class="status"><span class="dot bad"></span>Unreachable</span><div class="muted">${esc(n.error)}</div></td><td>-</td></tr>`;
    const running=n.container_status==='running';
    return `<tr><td><strong>${esc(n.name)}</strong><div class="muted">${esc(n.host)}</div></td><td><span class="status"><span class="dot ${running?'ok':''}"></span>${esc(n.container_status||'missing')}</span><div class="muted">${esc(n.container_uptime||'')}</div></td><td>${esc(n.renter||'-')}</td><td>${monitorLinks(n.name)}</td><td><div class="actions">${actionButton(n.name,'restart','Restart')}${actionButton(n.name,'stop','Stop',true)}${actionButton(n.name,'start','Start')}${actionButton(n.name,'recreate','Recreate',true)}${actionButton(n.name,'logs','Logs')}</div></td></tr>`;
  }).join('');
  updated.textContent=new Date().toLocaleTimeString();
}
async function runAction(node,action,button){
  if(action==='logs'){logsTitle.textContent=`${node} · rent-node logs`;logsContent.textContent='Loading…';logsDialog.showModal();const r=await fetch(`/api/nodes/${encodeURIComponent(node)}/logs`);logsContent.textContent=await r.text();return;}
  if((action==='stop'||action==='recreate')&&!confirm(`${node}: ${action}?`)) return;
  button.disabled=true;
  try{const r=await fetch(`/api/nodes/${encodeURIComponent(node)}/${action}`,{method:'POST'});const body=await r.json();if(!r.ok) throw new Error(body.detail||`HTTP ${r.status}`);await loadNodes();}catch(err){alert(err.message);}finally{button.disabled=false;}
}
tbody.addEventListener('click',e=>{const b=e.target.closest('button[data-node]');if(b)runAction(b.dataset.node,b.dataset.action,b);});
document.getElementById('refresh').addEventListener('click',()=>loadNodes().catch(err=>alert(err.message)));
loadNodes().catch(err=>{tbody.innerHTML=`<tr><td colspan="5">${esc(err.message)}</td></tr>`;});
setInterval(()=>loadNodes().catch(()=>{}),10000);
</script>
</body>
</html>
