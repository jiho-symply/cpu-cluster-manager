<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CPU Cluster Manager</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; background:#0b1020; color:#e7eaf0; }
    main { max-width:1600px; margin:0 auto; padding:24px 20px 40px; }
    header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:16px; }
    h1,h2 { margin:0; }
    h1 { font-size:24px; }
    h2 { font-size:18px; }
    .muted { color:#9aa4b2; }
    .error-text { color:#e3a0a0; font-size:12px; margin-top:5px; max-width:680px; overflow-wrap:anywhere; }
    .toolbar,.actions,.tabs,.cluster-head,.shutdown-actions,.monitor-toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    button,a.button { border:1px solid #34405a; background:#172036; color:#eef2f7; border-radius:8px; padding:8px 11px; cursor:pointer; text-decoration:none; white-space:nowrap; }
    button:hover,a.button:hover { background:#202b45; }
    button.danger { border-color:#8b3a43; background:#321923; }
    button.danger:hover { background:#49202b; }
    button:disabled { opacity:.4; cursor:default; }
    .tabs { margin-bottom:16px; border-bottom:1px solid #27324a; padding-bottom:10px; }
    .tab.active,.monitor-cluster.active { background:#2f6feb; border-color:#2f6feb; color:white; }
    .view[hidden] { display:none; }
    .cluster-card { background:#0e1526; border:1px solid #27324a; border-radius:12px; margin-bottom:18px; overflow:hidden; }
    .cluster-head { justify-content:space-between; padding:14px 14px 12px; border-bottom:1px solid #27324a; }
    .cluster-title { display:flex; gap:10px; align-items:baseline; }
    .badge { font-size:11px; border:1px solid #34405a; border-radius:999px; padding:3px 7px; color:#b7c2d0; }
    .shutdown-note { font-size:12px; color:#d2a8a8; padding:0 14px 12px; }
    table { width:100%; border-collapse:collapse; }
    th,td { text-align:left; padding:11px 10px; border-bottom:1px solid #27324a; vertical-align:middle; }
    th { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:#9aa4b2; }
    td { font-size:14px; }
    tr:last-child td { border-bottom:0; }
    .status { display:inline-flex; align-items:center; gap:7px; }
    .dot { width:9px; height:9px; border-radius:50%; background:#7b8496; flex:none; }
    .dot.ok { background:#3fb950; }
    .dot.bad { background:#f85149; }
    .actions-cell { min-width:720px; }
    .action-layout { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; width:100%; }
    .action-safe,.action-danger { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .action-danger { justify-content:flex-end; }
    .credential-box { margin-top:10px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; width:100%; padding:9px 10px; border:1px solid #34405a; border-radius:8px; background:#090e1a; }
    .credential-label { color:#9aa4b2; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
    .credential-box code { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:14px; padding:4px 8px; border:1px solid #27324a; border-radius:6px; background:#11182a; color:#f0f4fa; letter-spacing:.05em; }
    .credential-note { color:#7f8ba0; font-size:11px; }
    .copy-button { padding:5px 9px; font-size:12px; }
    .monitor-toolbar { justify-content:space-between; margin-bottom:10px; }
    #grafana-frame { display:block; width:100%; height:calc(100vh - 175px); min-height:620px; border:1px solid #27324a; border-radius:10px; background:#11182a; }
    dialog { width:min(820px,calc(100vw - 40px)); border:1px solid #34405a; border-radius:10px; background:#11182a; color:#eef2f7; padding:18px; }
    dialog::backdrop { background:rgba(0,0,0,.65); }
    #confirm-dialog { width:min(560px,calc(100vw - 40px)); }
    .dialog-head { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .confirm-message { color:#cbd3df; line-height:1.55; margin:14px 0 18px; white-space:pre-line; }
    .dialog-actions { display:flex; justify-content:flex-end; gap:8px; }
    pre { white-space:pre-wrap; word-break:break-word; background:#090e1a; padding:14px; border-radius:8px; max-height:60vh; overflow:auto; }
    form.logout { margin:0; }
    .warning { border:1px solid #6e4f2b; background:#251d12; padding:10px 12px; border-radius:8px; margin-bottom:16px; color:#e5c07b; }
    @media (max-width:1100px) {
      .table-wrap { overflow-x:auto; }
      table { min-width:1240px; }
      header,.cluster-head { align-items:flex-start; }
      #grafana-frame { min-height:520px; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>CPU Cluster Manager</h1>
      <div class="muted">Primary: {{ cluster }}{% if federated %} · federated control enabled{% endif %}</div>
    </div>
    <div class="toolbar">
      <span id="updated" class="muted">-</span>
      <button id="refresh" type="button">Refresh</button>
      <form class="logout" method="post" action="/logout"><button type="submit">Logout</button></form>
    </div>
  </header>

  <nav class="tabs" aria-label="Main views">
    <button class="tab active" type="button" data-view="control">Control</button>
    <button class="tab" type="button" data-view="monitoring">Monitoring</button>
  </nav>

  <section id="view-control" class="view">
    {% if federated %}
    <div class="warning">두 클러스터를 모두 종료할 때는 Cluster 2를 먼저 종료하고, 이 페이지를 제공하는 Cluster 1 master를 마지막에 종료하세요.</div>
    {% endif %}
    <div id="clusters">Loading…</div>
  </section>

  <section id="view-monitoring" class="view" hidden>
    <div class="monitor-toolbar">
      <div id="monitor-actions" class="actions"></div>
      <span id="monitor-label" class="muted">Auto resolution · &lt;5m Hot / ≥5m Archive</span>
    </div>
    <iframe id="grafana-frame" title="Grafana monitoring" loading="lazy"></iframe>
  </section>
</main>

<dialog id="logs-dialog">
  <div class="dialog-head"><strong id="logs-title">Logs</strong><button type="button" id="logs-close">Close</button></div>
  <pre id="logs-content">Loading…</pre>
</dialog>

<dialog id="confirm-dialog">
  <div class="dialog-head"><strong id="confirm-title">Confirm action</strong></div>
  <div id="confirm-message" class="confirm-message"></div>
  <div class="dialog-actions">
    <button type="button" id="confirm-cancel">Cancel</button>
    <button type="button" id="confirm-ok">Confirm</button>
  </div>
</dialog>

<script>
const clustersEl=document.getElementById('clusters');
const updated=document.getElementById('updated');
const logsDialog=document.getElementById('logs-dialog');
const logsTitle=document.getElementById('logs-title');
const logsContent=document.getElementById('logs-content');
const confirmDialog=document.getElementById('confirm-dialog');
const confirmTitle=document.getElementById('confirm-title');
const confirmMessage=document.getElementById('confirm-message');
const confirmOk=document.getElementById('confirm-ok');
const confirmCancel=document.getElementById('confirm-cancel');
const grafanaFrame=document.getElementById('grafana-frame');
const monitorActions=document.getElementById('monitor-actions');
const monitorLabel=document.getElementById('monitor-label');
let clusterData=[];
let grafanaLoaded=false;
let activeMonitorCluster='';
let confirmationResolver=null;

// Deliberately in-memory only: survives automatic/manual data refreshes because
// the page is not reloaded, but disappears on F5/Ctrl+R/browser navigation.
const credentialCache=new Map();

function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function credentialKey(cluster,node){return `${cluster}/${node}`;}
function actionButton(cluster,node,action,label,danger=false,disabled=false){return `<button type="button" data-cluster="${esc(cluster)}" data-node="${esc(node)}" data-action="${action}" class="${danger?'danger':''}" ${disabled?'disabled':''}>${label}</button>`;}
function monitorButton(cluster,node=''){return `<button type="button" data-monitor-cluster="${esc(cluster)}" data-monitor-node="${esc(node)}">Open</button>`;}

function credentialHtml(cluster,node){
  const credential=credentialCache.get(credentialKey(cluster,node));
  if(!credential) return '';
  return `<div class="credential-box"><span class="credential-label">Temporary PW</span><code>${esc(credential.password)}</code><button type="button" class="copy-button" data-copy-password="${esc(credential.password)}">Copy</button><span class="credential-note">kept until browser page reload</span></div>`;
}

function renderNode(cluster,n){
  if(!n.reachable){
    return `<tr><td><strong>${esc(n.name)}</strong><div class="muted">${esc(n.host)}</div></td><td><span class="status"><span class="dot bad"></span>Control unavailable</span><div class="error-text">${esc(n.error||'SSH control path unavailable')}</div></td><td>-</td><td>${monitorButton(cluster,n.name)}</td><td>-</td></tr>`;
  }

  const status=String(n.container_status||'missing');
  const running=status==='running';
  const canStart=status==='exited'||status==='created';
  const safe=`${actionButton(cluster,n.name,'logs','Logs')}${actionButton(cluster,n.name,'start','Start',false,!canStart)}${actionButton(cluster,n.name,'stop','Stop',false,!running)}${actionButton(cluster,n.name,'restart','Restart',false,!running)}`;
  const risky=`${actionButton(cluster,n.name,'reset-password','Reset PW',true,!running)}${actionButton(cluster,n.name,'recreate','Recreate',true)}${actionButton(cluster,n.name,'reboot','Reboot host',true)}${actionButton(cluster,n.name,'reset','Full Reset',true)}`;

  return `<tr><td><strong>${esc(n.name)}</strong><div class="muted">${esc(n.host)}</div></td><td><span class="status"><span class="dot ${running?'ok':''}"></span>${esc(status)}</span><div class="muted">${esc(n.container_uptime||'')}</div></td><td>${esc(n.renter||'-')}</td><td>${monitorButton(cluster,n.name)}</td><td class="actions-cell"><div class="action-layout"><div class="action-safe">${safe}</div><div class="action-danger">${risky}</div></div>${credentialHtml(cluster,n.name)}</td></tr>`;
}

function renderCluster(c){
  if(!c.reachable){
    return `<section class="cluster-card"><div class="cluster-head"><div class="cluster-title"><h2>${esc(c.cluster)}</h2><span class="badge">peer</span></div></div><div style="padding:14px"><span class="status"><span class="dot bad"></span>Master unreachable</span><div class="error-text">${esc(c.error||'')}</div></div></section>`;
  }
  const rows=(c.nodes||[]).map(n=>renderNode(c.cluster,n)).join('')||'<tr><td colspan="5">No compute nodes</td></tr>';
  return `<section class="cluster-card" data-cluster-card="${esc(c.cluster)}"><div class="cluster-head"><div class="cluster-title"><h2>${esc(c.cluster)}</h2><span class="badge">${c.local?'local':'peer'}</span><span class="muted">${(c.nodes||[]).length} compute nodes</span></div><div class="shutdown-actions"><button type="button" class="danger" data-shutdown-computes="${esc(c.cluster)}">Shutdown computes</button><button type="button" class="danger" data-shutdown-master="${esc(c.cluster)}" disabled>Shutdown master</button></div></div><div class="shutdown-note" data-shutdown-status="${esc(c.cluster)}">Master shutdown is locked until all compute nodes are explicitly powered off and confirmed offline.</div><div class="table-wrap"><table><thead><tr><th>Node</th><th>rent-node</th><th>Renter</th><th>Monitoring</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

function renderMonitoringButtons(){
  monitorActions.innerHTML=clusterData.filter(c=>c.reachable).map(c=>`<button type="button" class="monitor-cluster ${c.cluster===activeMonitorCluster?'active':''}" data-monitor-cluster="${esc(c.cluster)}">${esc(c.cluster)}</button>`).join('');
}

function selectView(name){
  document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!==`view-${name}`);
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===name));
  if(name==='monitoring'&&!grafanaLoaded){
    const first=clusterData.find(c=>c.reachable);
    if(first) openMonitoring(first.cluster,'');
  }
}

function openMonitoring(cluster,node=''){
  const c=clusterData.find(x=>x.cluster===cluster);
  if(!c||!c.reachable){alert(`${cluster} monitoring is unavailable`);return;}
  let url=`${c.grafana_base}/d/cluster-monitoring/cluster-monitoring?orgId=1`;
  if(node) url+=`&var-node=${encodeURIComponent(node)}`;
  grafanaFrame.src=url;
  activeMonitorCluster=cluster;
  monitorLabel.textContent=`${cluster} · Auto resolution: <5m Hot / ≥5m Archive`;
  grafanaLoaded=true;
  renderMonitoringButtons();
  selectView('monitoring');
}

function finishConfirmation(result){
  const resolver=confirmationResolver;
  confirmationResolver=null;
  if(confirmDialog.open) confirmDialog.close();
  if(resolver) resolver(result);
}

function requestConfirmation(title,message,danger=false){
  if(confirmationResolver) finishConfirmation(false);
  confirmTitle.textContent=title;
  confirmMessage.textContent=message;
  confirmOk.classList.toggle('danger',danger);
  return new Promise(resolve=>{
    confirmationResolver=resolve;
    confirmDialog.showModal();
  });
}

function actionConfirmation(cluster,node,action){
  const target=`${cluster}/${node}`;
  switch(action){
    case 'start': return {title:'Start rent-node',message:`${target}의 rent-node 컨테이너를 시작할까요?`,danger:false};
    case 'stop': return {title:'Stop rent-node',message:`${target}의 rent-node 컨테이너를 중지할까요?`,danger:false};
    case 'restart': return {title:'Restart rent-node',message:`${target}의 rent-node 컨테이너를 재시작할까요?`,danger:false};
    case 'reset-password': return {title:'Reset renter password',message:`${target}의 renter 비밀번호를 새 8자리 임시 비밀번호로 변경할까요?`,danger:true};
    case 'recreate': return {title:'Recreate rent-node',message:`${target}의 rent-node 컨테이너를 현재 이미지로 재생성합니다.\nhome/work/auth 데이터와 현재 renter 비밀번호는 유지됩니다.`,danger:true};
    case 'reboot': return {title:'Reboot compute host',message:`${target} compute host를 재부팅합니다.\nDocker의 정상 shutdown 경로를 사용하며 rent-node는 부팅 후 restart policy에 따라 복귀합니다.`,danger:true};
    case 'reset': return {title:'Full Reset',message:`${target}의 rent-node와 renter 저장소를 완전히 초기화합니다.\n/home, /workspace, auth, SSH host key, logs의 기존 데이터가 삭제되고 renter 계정과 비밀번호가 새로 생성됩니다. 이 작업은 되돌릴 수 없습니다.`,danger:true};
    default: return null;
  }
}

async function refreshShutdownState(c){
  if(!c.reachable) return;
  try{
    const r=await fetch(`/api/clusters/${encodeURIComponent(c.cluster)}/shutdown/state`);
    if(r.status===401){location.replace('/login');return;}
    if(!r.ok) return;
    const state=await r.json();
    const button=document.querySelector(`[data-shutdown-master="${CSS.escape(c.cluster)}"]`);
    const note=document.querySelector(`[data-shutdown-status="${CSS.escape(c.cluster)}"]`);
    if(!button||!note) return;
    button.disabled=!state.ready;
    if(state.ready){
      note.textContent='All compute nodes are confirmed offline. Master shutdown is enabled.';
    }else if((state.online||[]).length){
      note.textContent=`Master shutdown locked. Online compute nodes: ${(state.online||[]).join(', ')}`;
    }else{
      note.textContent='Master shutdown locked. Re-run Shutdown computes to explicitly confirm all offline nodes.';
    }
  }catch(_err){}
}

async function loadClusters(){
  const res=await fetch('/api/clusters',{headers:{Accept:'application/json'}});
  if(res.status===401){location.replace('/login');return;}
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  const data=await res.json();
  clusterData=data.clusters||[];
  clustersEl.innerHTML=clusterData.map(renderCluster).join('');
  renderMonitoringButtons();
  await Promise.all(clusterData.map(refreshShutdownState));
  updated.textContent=new Date().toLocaleTimeString();
}

function fallbackCopy(text){
  const area=document.createElement('textarea');
  area.value=text;
  area.setAttribute('readonly','');
  area.style.position='fixed';
  area.style.opacity='0';
  document.body.appendChild(area);
  area.select();
  const ok=document.execCommand('copy');
  area.remove();
  return ok;
}

async function copyPassword(text,button){
  let copied=false;
  try{
    if(navigator.clipboard&&window.isSecureContext){
      await navigator.clipboard.writeText(text);
      copied=true;
    }
  }catch(_err){}
  if(!copied) copied=fallbackCopy(text);
  if(!copied){alert('Copy failed. Select the password manually.');return;}
  const old=button.textContent;
  button.textContent='Copied';
  setTimeout(()=>{if(button.isConnected) button.textContent=old;},1200);
}

async function runAction(cluster,node,action,button){
  if(action==='logs'){
    logsTitle.textContent=`${cluster} · ${node} · rent-node logs`;
    logsContent.textContent='Loading…';
    logsDialog.showModal();
    const r=await fetch(`/api/clusters/${encodeURIComponent(cluster)}/nodes/${encodeURIComponent(node)}/logs`);
    if(r.status===401){location.replace('/login');return;}
    logsContent.textContent=await r.text();
    return;
  }

  const confirmation=actionConfirmation(cluster,node,action);
  if(!confirmation){alert(`Unsupported action: ${action}`);return;}
  if(!(await requestConfirmation(confirmation.title,confirmation.message,confirmation.danger))) return;

  button.disabled=true;
  try{
    const r=await fetch(`/api/clusters/${encodeURIComponent(cluster)}/nodes/${encodeURIComponent(node)}/${action}`,{method:'POST'});
    if(r.status===401){location.replace('/login');return;}
    const body=await r.json();
    if(!r.ok) throw new Error(typeof body.detail==='string'?body.detail:JSON.stringify(body.detail));

    if(action==='reset-password'||action==='reset'){
      const credential=body.credential;
      if(!credential||!credential.password) throw new Error(`${action} returned no credential`);
      credentialCache.set(credentialKey(cluster,node),credential);
    }
    if(action==='reboot'){
      alert(`${cluster}/${node}: reboot requested. The node may be temporarily unavailable while it restarts.`);
    }
    await loadClusters();
  }catch(err){
    alert(err.message);
  }finally{
    button.disabled=false;
  }
}

async function shutdownComputes(cluster,button){
  const ok=await requestConfirmation(
    'Shutdown all compute nodes',
    `${cluster}의 모든 rent-node를 먼저 정지하고 모든 compute host를 안전하게 종료합니다. 계속할까요?`,
    true,
  );
  if(!ok) return;
  button.disabled=true;
  const statusEl=document.querySelector(`[data-shutdown-status="${CSS.escape(cluster)}"]`);
  if(statusEl) statusEl.textContent='Stopping rent-node containers, powering off compute hosts, and waiting for offline confirmation…';
  try{
    const r=await fetch(`/api/clusters/${encodeURIComponent(cluster)}/shutdown/computes`,{method:'POST'});
    const body=await r.json();
    if(!r.ok||!body.all_offline) throw new Error(body.detail?JSON.stringify(body.detail):JSON.stringify(body.nodes||body));
    await loadClusters();
  }catch(err){
    if(statusEl) statusEl.textContent=`Shutdown incomplete: ${err.message}`;
    alert(err.message);
  }finally{
    button.disabled=false;
  }
}

async function shutdownMaster(cluster,button){
  const ok=await requestConfirmation(
    'Shutdown master',
    `${cluster} master를 종료합니다. 모든 compute가 종료 확인된 경우에만 서버가 이 요청을 허용합니다. 계속할까요?`,
    true,
  );
  if(!ok) return;
  button.disabled=true;
  try{
    const r=await fetch(`/api/clusters/${encodeURIComponent(cluster)}/shutdown/master`,{method:'POST'});
    const body=await r.json();
    if(!r.ok) throw new Error(typeof body.detail==='string'?body.detail:JSON.stringify(body.detail));
    alert(`${cluster} master poweroff requested.`);
  }catch(err){
    alert(err.message);
    button.disabled=false;
  }
}

document.getElementById('logs-close').addEventListener('click',()=>logsDialog.close());
confirmCancel.addEventListener('click',()=>finishConfirmation(false));
confirmOk.addEventListener('click',()=>finishConfirmation(true));
confirmDialog.addEventListener('cancel',e=>{e.preventDefault();finishConfirmation(false);});

document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>selectView(b.dataset.view)));
monitorActions.addEventListener('click',e=>{
  const b=e.target.closest('button[data-monitor-cluster]');
  if(b) openMonitoring(b.dataset.monitorCluster,'');
});
clustersEl.addEventListener('click',e=>{
  const copy=e.target.closest('button[data-copy-password]');
  if(copy){copyPassword(copy.dataset.copyPassword,copy);return;}
  const monitor=e.target.closest('button[data-monitor-cluster]');
  if(monitor){openMonitoring(monitor.dataset.monitorCluster,monitor.dataset.monitorNode||'');return;}
  const shutdownC=e.target.closest('button[data-shutdown-computes]');
  if(shutdownC){shutdownComputes(shutdownC.dataset.shutdownComputes,shutdownC);return;}
  const shutdownM=e.target.closest('button[data-shutdown-master]');
  if(shutdownM){shutdownMaster(shutdownM.dataset.shutdownMaster,shutdownM);return;}
  const b=e.target.closest('button[data-node]');
  if(b) runAction(b.dataset.cluster,b.dataset.node,b.dataset.action,b);
});
document.getElementById('refresh').addEventListener('click',()=>loadClusters().catch(err=>alert(err.message)));
loadClusters().catch(err=>{clustersEl.textContent=err.message;});
setInterval(()=>loadClusters().catch(()=>{}),10000);
</script>
</body>
</html>
