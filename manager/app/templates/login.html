<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ cluster }} · CPU Cluster Manager</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0b1020; color:#eef2f7; }
    .card { width:min(420px,calc(100vw - 32px)); background:#11182a; border:1px solid #27324a; border-radius:14px; padding:28px; box-shadow:0 18px 50px rgba(0,0,0,.28); }
    h1 { margin:0 0 6px; font-size:22px; }
    p { margin:0 0 22px; color:#9aa4b2; }
    label { display:block; font-size:13px; color:#b7c0cf; margin-bottom:8px; }
    input { width:100%; border:1px solid #34405a; background:#090e1a; color:#eef2f7; border-radius:9px; padding:12px; font-size:16px; outline:none; }
    input:focus { border-color:#6ea8fe; }
    button { width:100%; margin-top:14px; border:0; background:#2f6feb; color:white; border-radius:9px; padding:12px; font-size:15px; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.55; cursor:default; }
    #error { min-height:20px; margin-top:12px; color:#ff7b72; font-size:13px; }
  </style>
</head>
<body>
  <form class="card" id="login-form">
    <h1>CPU Cluster Manager</h1>
    <p>{{ cluster }}</p>
    <label for="password">Management password</label>
    <input id="password" type="password" autocomplete="current-password" autofocus required>
    <button id="submit" type="submit">Sign in</button>
    <div id="error"></div>
  </form>
<script>
const form=document.getElementById('login-form');
const password=document.getElementById('password');
const submit=document.getElementById('submit');
const error=document.getElementById('error');
form.addEventListener('submit',async e=>{
  e.preventDefault(); error.textContent=''; submit.disabled=true;
  try {
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password.value})});
    if(!r.ok){const body=await r.json().catch(()=>({}));throw new Error(body.detail||'Login failed');}
    location.replace('/');
  } catch(err) { error.textContent=err.message; password.select(); }
  finally { submit.disabled=false; }
});
</script>
</body>
</html>
