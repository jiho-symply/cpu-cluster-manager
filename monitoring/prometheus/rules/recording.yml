groups:
  - name: cluster-live
    interval: 1m
    rules:
      - record: cluster_node_cpu_utilization_ratio
        expr: 1 - avg by (cluster, platform, node) (rate(node_cpu_seconds_total{mode="idle"}[5m]))

      - record: cluster_node_memory_utilization_ratio
        expr: 1 - (max by (cluster, platform, node) (node_memory_MemAvailable_bytes) / max by (cluster, platform, node) (node_memory_MemTotal_bytes))

      - record: cluster_node_filesystem_utilization_ratio
        expr: |
          1 - (
            node_filesystem_avail_bytes{fstype!~"tmpfs|devtmpfs|overlay|squashfs|nsfs|tracefs|proc|sysfs|cgroup2?|autofs|mqueue|debugfs|securityfs|pstore|configfs|fusectl|rpc_pipefs"}
            /
            node_filesystem_size_bytes{fstype!~"tmpfs|devtmpfs|overlay|squashfs|nsfs|tracefs|proc|sysfs|cgroup2?|autofs|mqueue|debugfs|securityfs|pstore|configfs|fusectl|rpc_pipefs"}
          )

      - record: cluster_node_disk_utilization_ratio_max
        expr: max by (cluster, platform, node) (cluster_node_filesystem_utilization_ratio)

      - record: cluster_rent_cpu_percent
        expr: max by (cluster, platform, node) (cluster_rent_container_cpu_percent)

      - record: cluster_rent_memory_usage_bytes
        expr: max by (cluster, platform, node) (cluster_rent_container_memory_usage_bytes)

      - record: cluster_rent_running
        expr: max by (cluster, platform, node) (cluster_rent_container_running)

  - name: cluster-hourly-archive
    interval: 5m
    rules:
      - record: archive_node_cpu_utilization_ratio_avg1h
        expr: avg_over_time(cluster_node_cpu_utilization_ratio[1h])
      - record: archive_node_cpu_utilization_ratio_max1h
        expr: max_over_time(cluster_node_cpu_utilization_ratio[1h])
      - record: archive_node_memory_utilization_ratio_avg1h
        expr: avg_over_time(cluster_node_memory_utilization_ratio[1h])
      - record: archive_node_memory_utilization_ratio_max1h
        expr: max_over_time(cluster_node_memory_utilization_ratio[1h])
      - record: archive_node_filesystem_utilization_ratio_max1h
        expr: max_over_time(cluster_node_filesystem_utilization_ratio[1h])
      - record: archive_rent_cpu_percent_avg1h
        expr: avg_over_time(cluster_rent_cpu_percent[1h])
      - record: archive_rent_cpu_percent_max1h
        expr: max_over_time(cluster_rent_cpu_percent[1h])
      - record: archive_rent_memory_usage_bytes_avg1h
        expr: avg_over_time(cluster_rent_memory_usage_bytes[1h])
      - record: archive_rent_memory_usage_bytes_max1h
        expr: max_over_time(cluster_rent_memory_usage_bytes[1h])
