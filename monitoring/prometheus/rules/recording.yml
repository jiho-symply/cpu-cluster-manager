groups:
  - name: cluster-live
    interval: 5s
    rules:
      # irate uses the most recent counter samples, so with a 5s scrape this
      # reacts at the requested near-real-time resolution instead of a 2m average.
      - record: cluster_node_cpu_utilization_ratio
        expr: 1 - avg by (cluster, platform, node) (irate(node_cpu_seconds_total{mode="idle"}[30s]))

      - record: cluster_node_memory_utilization_ratio
        expr: 1 - (max by (cluster, platform, node) (node_memory_MemAvailable_bytes) / max by (cluster, platform, node) (node_memory_MemTotal_bytes))

      - record: cluster_node_filesystem_utilization_ratio
        expr: |
          1 - (
            node_filesystem_avail_bytes{fstype!~"tmpfs|devtmpfs|overlay|squashfs|nsfs|tracefs|proc|sysfs|cgroup2?|autofs|mqueue|debugfs|securityfs|pstore|configfs|fusectl|rpc_pipefs"}
            /
            node_filesystem_size_bytes{fstype!~"tmpfs|devtmpfs|overlay|squashfs|nsfs|tracefs|proc|sysfs|cgroup2?|autofs|mqueue|debugfs|securityfs|pstore|configfs|fusectl|rpc_pipefs"}
          )

      - record: cluster_node_disk_utilization_ratio_max
        expr: max by (cluster, platform, node) (cluster_node_filesystem_utilization_ratio)

      - record: cluster_rent_cpu_cores
        expr: max by (cluster, platform, node) (cluster_rent_container_cpu_percent) / 100

      - record: cluster_rent_memory_working_set_bytes
        expr: max by (cluster, platform, node) (cluster_rent_container_memory_usage_bytes)

      - record: cluster_rent_running
        expr: max by (cluster, platform, node) (cluster_rent_container_running)

  # Long-term contract: one aggregate sample per 5-minute bucket.
  # For each resource, preserve the bucket envelope as min / avg / max.
  # query_offset leaves a small late-sample margin before finalizing a bucket.
  - name: cluster-5m-archive
    interval: 5m
    query_offset: 15s
    rules:
      - record: archive_node_cpu_utilization_ratio_min5m
        expr: min_over_time(cluster_node_cpu_utilization_ratio[5m])
      - record: archive_node_cpu_utilization_ratio_avg5m
        expr: avg_over_time(cluster_node_cpu_utilization_ratio[5m])
      - record: archive_node_cpu_utilization_ratio_max5m
        expr: max_over_time(cluster_node_cpu_utilization_ratio[5m])

      - record: archive_node_memory_utilization_ratio_min5m
        expr: min_over_time(cluster_node_memory_utilization_ratio[5m])
      - record: archive_node_memory_utilization_ratio_avg5m
        expr: avg_over_time(cluster_node_memory_utilization_ratio[5m])
      - record: archive_node_memory_utilization_ratio_max5m
        expr: max_over_time(cluster_node_memory_utilization_ratio[5m])

      # Archive one node-level disk envelope instead of every mountpoint, bounding long-term cardinality.
      - record: archive_node_disk_utilization_ratio_min5m
        expr: min_over_time(cluster_node_disk_utilization_ratio_max[5m])
      - record: archive_node_disk_utilization_ratio_avg5m
        expr: avg_over_time(cluster_node_disk_utilization_ratio_max[5m])
      - record: archive_node_disk_utilization_ratio_max5m
        expr: max_over_time(cluster_node_disk_utilization_ratio_max[5m])

      - record: archive_rent_cpu_cores_min5m
        expr: min_over_time(cluster_rent_cpu_cores[5m])
      - record: archive_rent_cpu_cores_avg5m
        expr: avg_over_time(cluster_rent_cpu_cores[5m])
      - record: archive_rent_cpu_cores_max5m
        expr: max_over_time(cluster_rent_cpu_cores[5m])

      - record: archive_rent_memory_working_set_bytes_min5m
        expr: min_over_time(cluster_rent_memory_working_set_bytes[5m])
      - record: archive_rent_memory_working_set_bytes_avg5m
        expr: avg_over_time(cluster_rent_memory_working_set_bytes[5m])
      - record: archive_rent_memory_working_set_bytes_max5m
        expr: max_over_time(cluster_rent_memory_working_set_bytes[5m])

      - record: archive_rent_running_min5m
        expr: min_over_time(cluster_rent_running[5m])
      - record: archive_rent_running_avg5m
        expr: avg_over_time(cluster_rent_running[5m])
      - record: archive_rent_running_max5m
        expr: max_over_time(cluster_rent_running[5m])
