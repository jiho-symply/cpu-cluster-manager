global:
  scrape_interval: 5m
  scrape_timeout: 30s
  evaluation_interval: 5m

scrape_configs:
  - job_name: five-minute-federation
    honor_labels: true
    metrics_path: /federate
    params:
      'match[]':
        - '{__name__=~"archive_.*5m"}'
    static_configs:
      - targets:
          - prometheus-hot:9090
