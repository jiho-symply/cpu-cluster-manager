name: CI

on:
  push:
    branches: [main, dual-os-support]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Run repository checks
        run: |
          bash scripts/static-check.sh
          bash scripts/check-manager-container-security.sh
          bash scripts/credential-ui-check.sh
          bash scripts/rollout-safety-check.sh
